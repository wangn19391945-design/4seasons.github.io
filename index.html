<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机数生成器 (0-140)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .number-display {
            font-size: 80px;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .number-display.rolling {
            color: #999;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            outline: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            font-size: 14px;
            padding: 10px 30px;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .history {
            margin-top: 30px;
            text-align: left;
        }

        .history h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 120px;
            overflow-y: auto;
        }

        .history-item {
            background: #f0f0f0;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 14px;
            color: #667eea;
            font-weight: bold;
        }

        .range-info {
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .number-display {
                font-size: 60px;
            }

            .btn {
                padding: 12px 40px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 随机数生成器</h1>
        <p class="subtitle">范围：0 - 140</p>

        <div class="number-display" id="numberDisplay">?</div>

        <button class="btn" id="generateBtn" onclick="generateNumber()">生成随机数</button>
        <button class="btn btn-secondary" id="copyBtn" onclick="copyNumber()">复制结果</button>

        <div class="history">
            <h3>📋 历史记录</h3>
            <div class="history-list" id="historyList"></div>
        </div>

        <p class="range-info">点击"生成随机数"按钮或按空格键</p>
    </div>

    <script>
        let history = [];
        let isRolling = false;

        function generateNumber() {
            if (isRolling) return;

            isRolling = true;
            const display = document.getElementById('numberDisplay');
            const btn = document.getElementById('generateBtn');

            display.classList.add('rolling');
            btn.disabled = true;

            let rollCount = 0;
            const maxRolls = 20;
            const interval = setInterval(() => {
                display.textContent = Math.floor(Math.random() * 141);
                rollCount++;

                if (rollCount >= maxRolls) {
                    clearInterval(interval);
                    const finalNumber = Math.floor(Math.random() * 141);
                    display.textContent = finalNumber;
                    display.classList.remove('rolling');
                    btn.disabled = false;
                    isRolling = false;

                    // 添加到历史记录
                    history.unshift(finalNumber);
                    if (history.length > 20) history.pop();
                    updateHistory();
                }
            }, 50);
        }

        function copyNumber() {
            const number = document.getElementById('numberDisplay').textContent;
            if (number === '?') {
                alert('请先生成一个随机数！');
                return;
            }

            navigator.clipboard.writeText(number).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.textContent;
                btn.textContent = '已复制！';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 1500);
            }).catch(() => {
                // 降级方案
                const textarea = document.createElement('textarea');
                textarea.value = number;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);

                const btn = document.getElementById('copyBtn');
                btn.textContent = '已复制！';
                setTimeout(() => {
                    btn.textContent = '复制结果';
                }, 1500);
            });
        }

        function updateHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = history.map(num => `<span class="history-item">${num}</span>`).join('');
        }

        // 空格键快捷生成
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !isRolling) {
                e.preventDefault();
                generateNumber();
            }
        });
    </script>
</body>
</html>
